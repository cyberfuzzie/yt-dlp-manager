services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ${DOWNLOAD_BASE_DIR:-/home/cyberfuzzie/Downloads/yt-dlp-manager}:/downloads
      - ./backend/src/main/resources/application.conf:/app/application.conf:ro
    environment:
      - APP_DOWNLOAD_BASE_DIRECTORY=/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: yt-dlp-manager-network
