version: 2
updates:
  # Frontend dependencies. pnpm is part of the "npm" ecosystem; Dependabot
  # detects frontend/pnpm-lock.yaml automatically.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"

  # Backend dependencies (Gradle / Kotlin).
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # All Ktor modules must share the exact same version. Dependabot
    # otherwise opens one PR per module, which would mix incompatible
    # versions (e.g. ktor-server-core 3.6.0 with ktor-server-netty
    # 2.3.11) and break the build. Group every io.ktor dependency into
    # a single pull request so they are always bumped together.
    groups:
      ktor:
        patterns:
          - "io.ktor:*"

  # GitHub Actions workflow action versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
